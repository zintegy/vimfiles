# After editing this file, reload it inside an existing tmux session with:
#     tmux source-file ~/.tmux.conf

set -g set-clipboard on
set -ga terminal-overrides ',xterm*:Ms=\E]52;c;%p2%s\a'

# When user selects a window with a pending notification, clear the tab color.
# Each script is gated on existence so a fresh machine without these files
# won't error out on every hook fire.
set-hook -g after-select-window 'run-shell -b "[ -x ~/.config/tmux/clear-notify.sh ] && ~/.config/tmux/clear-notify.sh #{window_id} #{pane_tty}"'

# After a client (iTerm2 -CC) attaches, color tabs by window name and set
# the per-devbox iTerm2 profile. Runs after iTerm2 has registered all tabs,
# avoiding the startup race condition.
# Profile must be set BEFORE tab colors -- switching profile resets the tab
# color, so doing it second would wipe out color-tabs.sh's work.
set-hook -g client-attached 'run-shell -b "[ -x ~/.config/tmux/profile-tabs.sh ] && ~/.config/tmux/profile-tabs.sh; [ -x ~/.config/tmux/color-tabs.sh ] && ~/.config/tmux/color-tabs.sh"'

# Re-apply on new windows so freshly-created tabs also pick up the per-devbox
# profile (and any matching window-name color). Pass #{window_id} so the
# scripts only touch the newly-created window, not every existing pane.
set-hook -g after-new-window 'run-shell -b "[ -x ~/.config/tmux/profile-tabs.sh ] && ~/.config/tmux/profile-tabs.sh #{window_id}; [ -x ~/.config/tmux/color-tabs.sh ] && ~/.config/tmux/color-tabs.sh #{window_id}"'
