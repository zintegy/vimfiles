set -g set-clipboard on
set -ga terminal-overrides ',xterm*:Ms=\E]52;c;%p2%s\a'

# When user selects a window with a pending notification, clear the tab color.
set-hook -g after-select-window 'run-shell -b "~/.config/tmux/clear-notify.sh #{window_id} #{pane_tty}"'

# After a client (iTerm2 -CC) attaches, color tabs by window name. Runs
# after iTerm2 has registered all tabs, avoiding the startup race condition.
set-hook -g client-attached 'run-shell -b "~/.config/tmux/color-tabs.sh"'
